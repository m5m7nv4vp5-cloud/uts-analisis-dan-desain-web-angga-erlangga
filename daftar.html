<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar | Portal Mahasiswa</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page form-page">
    <nav class="topbar"><a class="brand" href="index.html">✦ PORTAL MAHASISWA</a><span>FORMULIR PENDAFTARAN</span></nav>
    <section class="form-card">
      <div class="form-art"><div class="art-icon">📚</div><p class="eyebrow">LANGKAH PERTAMA</p><h1>Daftar akun<br><em>mahasiswa</em></h1><p>Lengkapi formulir untuk melanjutkan ke halaman login.</p></div>
      <form action="login.html">
        <h2>Buat Akun</h2><p class="muted">Masukkan data pendaftaran kamu.</p>
        <label>Nama Lengkap<input type="text" placeholder="Nama lengkap" required></label>
        <label>Email<input type="email" placeholder="nama@email.com" required></label>
        <label>Password<input type="password" placeholder="Buat password" required></label>
        <button class="btn btn-primary" type="submit">Daftar</button>
        <a class="back-link" href="index.html">← Kembali ke halaman utama</a>
      </form>
    </section>
    <footer>© 2026 Portal Mahasiswa</footer>
  </main>
</body>
</html>
